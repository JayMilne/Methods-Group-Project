name: Main Workflow
on: push

jobs:
  build:
    name: Run Main
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Compile with Maven
        run: mvn compile
      - name: Run docker compose
        run: docker compose up --abort-on-container-exit
